version: 2
updates:
  # Demo app dependencies (Angular / Ionic / Capacitor). The npm ecosystem also reads the
  # pnpm-lock.yaml this demo uses.
  - package-ecosystem: npm
    directory: /example-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # pnpm 11 rejects lockfile entries published within the last 24h (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION), and it
    # checks on `pnpm install --frozen-lockfile` too, so a PR for a release that is still inside that window fails CI.
    cooldown:
      default-days: 2
    groups:
      # The framework packages peer-depend on each other at the exact same version (@angular/router@22.2.5 wants
      # @angular/core@22.2.5). pnpm only warns on that mismatch, so single-package bumps pass CI and leave the versions
      # out of step. Keep them in one PR, as ionic-cordova-docker does.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
        update-types: ['minor', 'patch']
      # @capacitor/core, cli, android and ios are meant to be on the same version; the official plugins move with them.
      capacitor:
        patterns:
          - '@capacitor/*'
        exclude-patterns:
          # A standalone asset-generation tool on its own release cycle.
          - '@capacitor/assets'
        update-types: ['minor', 'patch']
      # A new major gets its own PR per framework, so it doubles as the heads-up that the major is out. It will likely
      # fail CI: check out its branch and run the migrations Dependabot skips (`ng update <pkg> --migrate-only --from=<old>`
      # for Angular, `npx cap migrate` for Capacitor). Keeping it apart from the minor/patch group means one failing major
      # doesn't sit in the same PR as routine bumps.
      angular-major:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
        update-types: ['major']
      capacitor-major:
        patterns:
          - '@capacitor/*'
        exclude-patterns:
          - '@capacitor/assets'
        update-types: ['major']

  # Base image (ubuntu) referenced by the canonical Docker files.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Base image referenced by the demo's mirrored Docker files.
  - package-ecosystem: docker
    directory: /example-app
    schedule:
      interval: weekly

  # The GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
